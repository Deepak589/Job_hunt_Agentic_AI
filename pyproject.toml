[project]
name = "agentic-ai"
version = "0.1.0"
description = "JobPilot — multi-agent job search and CV tailoring"
readme = "README.md"
authors = [
    { name = "Deepak589", email = "carzydeepak31@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # orchestration
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.5.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # retrieval: see [project.optional-dependencies].retrieval — NOT in the base install
    # ingest
    "httpx>=0.28",
    "tenacity>=9.0",
    "trafilatura>=2.0",
    "extruct>=0.17",
    "lingua-language-detector>=2.0",
    # storage & output
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "pypdf>=5.0",
    # ops
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.2.3",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
# The evidence store (src/agentic_ai/evidence.py) is built and calibrated but is NOT in the
# per-job path: `coverage.retrieve_evidence` / `score_coverage` are its only callers and the
# slim graph calls neither, so a run never touches it. Keeping torch in the base install made
# every `uv sync` pay ~3GB for a subsystem no job uses. The code, the calibration record in
# `config.sem_threshold` and the on-disk index at `data/chroma` are untouched — installing
# this extra restores the subsystem exactly as it was.
#   uv sync --extra dev --extra retrieval
retrieval = [
    "sentence-transformers>=3.3",
    "chromadb>=0.5",
]
tracing = [
    "langchain>=1.4.1",
    "langfuse>=2.53",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "ipykernel>=7.3.0",
]

[project.scripts]
jobpilot = "agentic_ai.cli:app"
jobpilot-mcp = "agentic_ai.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# chromadb and sentence-transformers are in the optional `retrieval` extra, so a base
# install has neither installed nor stubbed. Without this, `mypy src` — which the
# definition of done requires — would report import-not-found for evidence.py's
# TYPE_CHECKING imports and pass or fail depending on which extras happen to be present.
[[tool.mypy.overrides]]
module = ["chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true
