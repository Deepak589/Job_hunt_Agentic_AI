  - id: proj.rag_pipeline
    name: RAG Pipeline — Hand-Rolled Retrieval, Validated Against LangChain at Scale
    repo: github.com/Deepak589/RAG_pipeline
    context: personal / research build
    stack: [Python, LangChain, BM25, dense bi-encoder, RRF, cross-encoder, pgvector, Ollama]
    bullets:
      - id: proj.rag_pipeline.b1
        outcome: built a hand-rolled hybrid retriever from scratch before reaching for a framework
        metric: "0.833 recall@5 / 0.672 MRR on a 55-question labeled golden set"
        method: BM25 + dense bi-encoder, RRF fusion, cross-encoder reranking, across 4 iterative stages
        tags: [rag, hybrid-retrieval, bm25, reranking, evaluation, information-retrieval]
      - id: proj.rag_pipeline.b2
        outcome: caught a silent recall regression from LangChain's default BM25 tokenizer and fixed it, confirming framework parity before trusting it at scale
        metric: "0.06-recall regression; fixed to 0.854 recall@5"
        method: rebuilt the identical retriever on LangChain over the same corpus and labels with framework as the only changed variable
        tags: [rag, langchain, evaluation, benchmarking, debugging, ablation]
      - id: proj.rag_pipeline.b3
