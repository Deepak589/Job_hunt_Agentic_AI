  - id: proj.food_retrieval
    name: Food Image-to-Recipe Retrieval — Multimodal Deep Learning
    repo: github.com/Deepak589/ML_Final_project    # verified 2026-09-13
    context: MSc coursework - ML course final project
    stack: [PyTorch, CLIP ViT-B/32, DistilBERT, InfoNCE, FAISS, OmegaConf]
    note: >
      The repo holds TWO systems. (a) a zero-shot pipeline using both CLIP encoders with
      FAISS search and an ingredient-fusion weight - this is the one with measured results
      in outputs/retrieval_results.csv and outputs/fusion_comparison.csv. (b) a trained
      dual-encoder in src/ (frozen CLIP images + DistilBERT text, symmetric InfoNCE).
      Never merge their numbers into one claim.
    bullets:
      - id: proj.food_retrieval.b1
        outcome: built an image-to-recipe retrieval system and measured it in both directions instead of reporting only the flattering one
        metric: "3,000-recipe database; 61% Recall@10 and median rank 6 image-to-recipe; 55% Recall@10 and median rank 8 recipe-to-image"
        method: >
          encoded images and recipe text into CLIP's shared 512-d space, L2-normalised, with
          FAISS inner-product search at inference; evaluated Recall@1/5/10 and medR in both
          directions (source: outputs/retrieval_results.csv)
        tags: [multimodal, clip, faiss, retrieval, evaluation, embeddings, information-retrieval]

      - id: proj.food_retrieval.b2
        outcome: raised retrieval accuracy by sweeping the recipe-text vs ingredient fusion weight rather than picking one by feel
        metric: "Recall@10 41.9% -> 61.0% across alpha 0.3/0.5/0.7/0.9; Recall@1 13.4% -> 22.4%"
        method: >
          ablated the blend weight between full recipe-text embeddings and ingredient-only
          embeddings over 4 values, selected alpha 0.9 on measured Recall@K
          (source: outputs/fusion_comparison.csv)
        tags: [ablation, hyperparameter-search, evaluation, experimentation, retrieval]

      - id: proj.food_retrieval.b3
        outcome: built a second, trained dual-encoder variant with a config-driven experiment harness and a real test suite
        metric: "58 tests; 3 switchable fusion modes; 13,582 images cached; ~10x faster training"
        method: >
          frozen CLIP ViT-B/32 image encoder and DistilBERT recipe-text encoder with separate
          ingredient/instruction streams, projected to a shared 1024-d space and trained with
          symmetric InfoNCE (temperature 0.07); OmegaConf configs with CLI overrides; concat,
          cross-attention and ingredients-only modes; AMP, gradient accumulation, early stopping;
          CLIP features precomputed once and cached rather than re-encoded every epoch
        caveat: >
          this trained variant reported medR 10 of 200 val recipes on a 2,000-recipe local run
          over 6 epochs. Do NOT attach that number to the 13,582 figure, and do NOT mix it with
          the zero-shot results in b1/b2.
        tags: [pytorch, contrastive-learning, distilbert, testing, reproducibility, mlops, caching]

